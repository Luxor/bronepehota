<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Бронепехота — сайт переехал</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://bronepehota.github.io/">
<script>
  (function () {
    var NEW = 'https://bronepehota.github.io';
    // old project URL was luxor.github.io/bronepehota/<path> — strip the /bronepehota segment
    var path = location.pathname.replace(/^\/bronepehota\/?/, '/');
    location.replace(NEW + path + location.search + location.hash);
  })();
</script>
</head>
<body>
<p>Сайт переехал на <a href="https://bronepehota.github.io/">bronepehota.github.io</a>.</p>
</body>
</html>
